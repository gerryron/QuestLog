<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg)"/>

  <!-- Inner glow ring -->
  <rect x="56" y="56" width="400" height="400" rx="80" stroke="url(#accent)" stroke-width="6" opacity="0.3"/>

  <!-- Stylized Q letter -->
  <text x="256" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="320" font-weight="900" fill="white">Q</text>

  <!-- Quest mark (small star/diamond in the Q tail) -->
  <polygon points="380,340 396,320 412,340 396,360" fill="url(#accent)"/>

  <!-- Small accent dots -->
  <circle cx="380" cy="280" r="8" fill="#f59e0b" opacity="0.6"/>
</svg>
