<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" id="theme-color-meta" content="#ffffff" />
    <meta name="description" content="QuestLog — Gamified Goal Tracker" />
    <link rel="icon" type="image/svg+xml" href="/QuestLog/favicon.svg" />
    <title>QuestLog</title>
    <script>
      // Theme: respects user preference, falls back to OS
      (function () {
        var html = document.documentElement;
        var meta = document.getElementById('theme-color-meta');
        var darkQuery = window.matchMedia('(prefers-color-scheme: dark)');

        function getTheme() {
          try {
            var data = JSON.parse(localStorage.getItem('questlog_data'));
            return (data && data.theme) || 'auto';
          } catch (e) {
            return 'auto';
          }
        }

        function apply() {
          var theme = getTheme();
          var isDark = theme === 'dark' || (theme === 'auto' && darkQuery.matches);
          if (isDark) {
            html.classList.add('dark');
            meta.setAttribute('content', '#0f172a');
          } else {
            html.classList.remove('dark');
            meta.setAttribute('content', '#ffffff');
          }
        }

        apply();
        darkQuery.addEventListener('change', apply);
        window.addEventListener('storage', apply);
      })();
    </script>
    <script type="module" crossorigin src="/QuestLog/assets/index-CTvb5rfy.js"></script>
    <link rel="stylesheet" crossorigin href="/QuestLog/assets/index-DdCn47v6.css">
  <link rel="manifest" href="/QuestLog/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/QuestLog/registerSW.js"></script></head>
  <body class="min-h-screen bg-background font-sans antialiased">
    <div id="root"></div>
  </body>
</html>
